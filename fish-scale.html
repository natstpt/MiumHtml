<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ตาชั่งผลไม้ 5 กิโลกรัม</title>
  <meta name="description" content="ตาชั่งผลไม้แบบโต้ตอบ ช่วงน้ำหนัก 0–5 กิโลกรัม">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23e33221'/%3E%3Cpath d='M17 36c7-12 23-12 31 0-8 12-24 12-31 0Zm31 0 8-8v16Z' fill='white'/%3E%3Ccircle cx='27' cy='33' r='2' fill='%231c2730'/%3E%3C/svg%3E">
  <style>
    :root{font-family:"Noto Sans Thai","Tahoma",system-ui,sans-serif;color:#16212a;background:#eef4f6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 5%,#fff 0 26%,#e7f1f3 72%,#d6e5e8 100%)}
    main{width:min(1180px,100%);margin:auto;padding:24px;display:grid;grid-template-columns:minmax(0,780px) minmax(270px,340px);gap:28px;align-items:center;min-height:100vh}
    .scale-wrap{position:relative;width:100%;filter:drop-shadow(0 18px 22px #31515f25)}
    .scale-image{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
    .dial{position:absolute;left:30.55%;top:41.88%;width:40.3%;aspect-ratio:1;filter:drop-shadow(0 3px 3px #18242b55)}
    .panel{background:#fff;border:1px solid #d9e3e5;border-radius:24px;padding:28px;box-shadow:0 20px 55px #39535b1c}
    h1{font-size:clamp(1.45rem,3vw,2.1rem);margin:0 0 8px;line-height:1.25}
    .hint{margin:0 0 24px;color:#5c6c72;line-height:1.6}
    label{display:block;font-weight:700;margin-bottom:9px}
    .input-row{display:flex;align-items:center;border:2px solid #bac8cc;border-radius:15px;overflow:hidden;background:#fff;transition:.2s}
    .input-row:focus-within{border-color:#e33221;box-shadow:0 0 0 4px #e3322118}
    input{width:100%;border:0;outline:0;padding:14px 8px 14px 16px;font:700 1.35rem/1 system-ui;background:transparent;color:#172129}
    .unit{padding:0 16px;color:#58676c;font-weight:700}
    input[type=range]{appearance:none;width:100%;padding:0;margin:24px 0 12px;height:8px;border-radius:99px;background:linear-gradient(90deg,#e33221 var(--progress,0%),#dde5e7 var(--progress,0%));cursor:pointer}
    input[type=range]::-webkit-slider-thumb{appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:7px solid #e33221;box-shadow:0 2px 7px #1c273044}
    .range-labels{display:flex;justify-content:space-between;font-size:.88rem;color:#65747a}
    .reading{margin-top:25px;padding:18px;border-radius:17px;background:#17242a;color:#fff;text-align:center}
    .reading span{display:block;font-size:.85rem;color:#b9c8cd;margin-bottom:3px}
    .reading strong{font-size:2rem;font-variant-numeric:tabular-nums}
    .export-btn{width:100%;margin-top:14px;border:0;border-radius:15px;padding:14px 16px;background:#e33221;color:#fff;font-family:inherit;font-size:1rem;font-weight:800;line-height:1.25;cursor:pointer;box-shadow:0 8px 20px #e3322130;transition:transform .15s,background .15s}
    .export-btn:hover{background:#c92a1b;transform:translateY(-1px)}
    .export-btn:active{transform:translateY(1px)}
    .export-btn:disabled{opacity:.65;cursor:wait;transform:none}
    .export-note{margin:9px 0 0;text-align:center;color:#65747a;font-size:.82rem;line-height:1.45}
    .error{min-height:22px;color:#bd2418;font-size:.88rem;margin-top:9px}
    @media(max-width:820px){main{grid-template-columns:1fr;padding:14px;gap:10px}.scale-wrap{max-width:680px;margin:auto}.panel{padding:22px}.hint{margin-bottom:17px}}
  </style>
  <link rel="stylesheet" href="navigation.css?v=3">
<style>
.site-banner{width:min(680px,calc(100% - 32px));margin:10px auto 0;overflow:hidden;border-radius:18px;box-shadow:0 12px 28px #39535b24}
.site-banner img{display:block;width:100%;height:auto}
main{min-height:calc(100svh - 320px)}
@media(max-width:699px){main{min-height:0}}
</style>
  <style>
    #scaleArtwork{width:100%;height:auto;display:block;user-select:none}
    #dial{touch-action:none;overflow:visible}
    #needle{cursor:grab}#dial.dragging #needle{cursor:grabbing}
  </style>
<style>
.value-toggle,.unit-toggle{flex-shrink:0;min-height:44px;border:0;border-radius:10px;padding:8px 12px;background:#e8edef;color:#26343a;font:700 14px Tahoma,system-ui,sans-serif;cursor:pointer}
.input-row{position:relative}.value-toggle{margin-right:6px}.unit-toggle{margin-right:6px}
body.values-hidden .input-row input,body.values-hidden .reading strong{visibility:hidden}
body.values-hidden .input-row::before{content:"ซ่อนค่าอยู่";position:absolute;left:16px;color:#65747a;font-size:16px;pointer-events:none}
body.values-hidden .reading::after{content:"ซ่อนค่าอยู่";display:block;font-size:20px}
body.values-hidden .reading strong{display:none}
body.values-hidden #error{visibility:hidden}
</style></head>
<body>
<nav class="site-nav" aria-label="เลือกเครื่องมือ"><span class="site-brand">ครูเมียม ปูชิตา 👩‍🏫</span><div class="site-links"><a href="index.html">นาฬิกา</a><a href="fish-scale.html" aria-current="page">ตาชั่ง</a></div></nav>
  <div class="site-banner"><img src="assets/classroom-banner.webp" alt="คุณครูกำลังสอนนักเรียนในห้องเรียน" decoding="async"></div>
  <main>
    <div class="scale-wrap" aria-label="หน้าปัดตาชั่ง">
      <svg id="scaleArtwork" viewBox="0 0 600 810" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ตาชั่งพร้อมผลไม้บนถาด">
        <defs><linearGradient id="tray" x2="0" y2="1"><stop stop-color="#e8edf0"/><stop offset="1" stop-color="#7c939e"/></linearGradient></defs>
        <path d="M220 185H380L390 240H210Z" fill="#d83529" stroke="#9d251e" stroke-width="4"/>
        <g aria-label="แอปเปิล ส้ม และลูกแพร์">
          <path d="M205 69C154 36 119 75 129 122C140 173 184 176 205 160C235 181 272 160 276 112C280 70 243 47 205 69Z" fill="#e64b3d" stroke="#ad2c27" stroke-width="4"/>
          <path d="M205 71Q204 45 220 30" fill="none" stroke="#725038" stroke-width="9" stroke-linecap="round"/>
          <path d="M211 48Q245 15 267 40Q240 66 211 48Z" fill="#378457"/>
          <path d="M153 86Q142 103 151 122" fill="none" stroke="#ffb0a0" stroke-width="10" stroke-linecap="round"/>
          <path d="M403 47C378 47 381 77 368 95C328 144 355 174 405 176C457 177 478 139 444 99C426 79 431 47 403 47Z" fill="#b3ce49" stroke="#738d2d" stroke-width="4"/>
          <path d="M405 49L413 25" stroke="#725038" stroke-width="8" stroke-linecap="round"/>
          <circle cx="302" cy="124" r="55" fill="#f39b2f" stroke="#cf711c" stroke-width="4"/>
          <path d="M266 112Q269 93 285 87" fill="none" stroke="#ffd78c" stroke-width="9" stroke-linecap="round"/>
          <path d="M300 71Q311 43 337 56Q329 81 300 71Z" fill="#378457"/>
        </g>
        <path d="M78 168H522L498 202Q300 230 102 202Z" fill="url(#tray)" stroke="#526872" stroke-width="5" stroke-linejoin="round"/>
        <path d="M78 168H522" stroke="#f8fbfc" stroke-width="6"/>
      <svg id="dial" x="0" y="210" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="หน้าปัดตาชั่งช่วง 0 ถึง 5 กิโลกรัม">
        <defs>
          <radialGradient id="face" cx="48%" cy="42%"><stop offset="0" stop-color="#fff"/><stop offset=".78" stop-color="#fbfcfc"/><stop offset="1" stop-color="#e9edef"/></radialGradient>
          <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#78838b"/><stop offset=".18" stop-color="#f4f7f8"/><stop offset=".48" stop-color="#8d989f"/><stop offset=".72" stop-color="#fff"/><stop offset="1" stop-color="#69757c"/></linearGradient>
          <filter id="needleShadow"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity=".35"/></filter>
        </defs>
        <circle cx="300" cy="300" r="294" fill="url(#rim)" stroke="#263038" stroke-width="7"/>
        <circle cx="300" cy="300" r="270" fill="url(#face)" stroke="#343d43" stroke-width="4"/>
        <g id="ticks"></g><g id="labels"></g>
        <text id="capacity" x="300" y="154" text-anchor="middle" font-size="52" font-weight="900" fill="#1c252a">5 kg</text>
        <g id="needle" transform="rotate(0 300 300)" filter="url(#needleShadow)">
          <path d="M300 320L300 75" stroke="transparent" stroke-width="55" pointer-events="stroke"/>
          <path d="M287 320 L294 84 Q300 60 306 84 L313 320 Z" fill="#df2f20" stroke="#852017" stroke-width="4"/>
        </g>
        <circle cx="300" cy="300" r="30" fill="#29343a" stroke="#f4f6f7" stroke-width="7"/>
        <circle cx="300" cy="300" r="10" fill="#dce2e4"/>
      </svg>
      </svg>
    </div>

    <section class="panel">
      <h1>กำหนดน้ำหนักผลไม้</h1>
      <p class="hint">ลากเข็มด้วยเมาส์หรือนิ้ว หรือใส่น้ำหนักตั้งแต่ 0 ถึง 5 กิโลกรัม</p>
      <label for="weight">น้ำหนัก</label>
      <div class="input-row">
        <input id="weight" type="number" min="0" max="5" step="0.1" value="2.5" inputmode="decimal" aria-describedby="error">
        <button class="unit-toggle" id="toggleUnit" type="button" aria-label="เปลี่ยนหน่วยเป็นกรัม">kg ⇄</button><button class="value-toggle" id="toggleValue" type="button" aria-pressed="false" aria-label="ซ่อนหรือแสดงตัวเลขน้ำหนัก">ซ่อนตัวเลข</button>
      </div>
      <div id="error" class="error" role="status"></div>
      <input id="slider" type="range" min="0" max="5" step="0.1" value="2.5" aria-label="เลื่อนเพื่อกำหนดน้ำหนัก">
      <div class="range-labels"><span>0 กก.</span><span>5 กก.</span></div>
      <div class="reading"><span>น้ำหนักที่แสดง</span><strong id="reading">2.5 กก.</strong></div>
      <button class="random-btn" id="random" type="button">สุ่มน้ำหนัก (Random)</button>
      <button class="export-btn" id="export" type="button">ส่งออกเป็น PNG พื้นหลังโปร่งใส</button>
      <p class="export-note" id="exportStatus">ไฟล์จะใช้ตำแหน่งเข็มตามน้ำหนักล่าสุด</p>
    </section>
  </main>
  <script>
    const NS='http://www.w3.org/2000/svg', ticks=document.querySelector('#ticks'), labels=document.querySelector('#labels');
    const point=(radius,angle)=>{const a=(angle-90)*Math.PI/180;return [300+radius*Math.cos(a),300+radius*Math.sin(a)]};
    for(let i=0;i<50;i++){
      const angle=(i/50)*360, major=i%10===0, mid=i%5===0;
      const [x1,y1]=point(major?207:mid?219:230,angle), [x2,y2]=point(257,angle);
      const line=document.createElementNS(NS,'line');
      Object.entries({x1,y1,x2,y2,stroke:'#172027','stroke-width':major?14:mid?8:4,'stroke-linecap':'butt'}).forEach(([k,v])=>line.setAttribute(k,v));ticks.append(line);
      if(major&&i>0){const [x,y]=point(176,angle), text=document.createElementNS(NS,'text');text.setAttribute('x',x);text.setAttribute('y',y+17);text.setAttribute('text-anchor','middle');text.setAttribute('font-size','58');text.setAttribute('font-weight','900');text.setAttribute('fill','#1b252a');text.textContent=i/10;labels.append(text)}
    }
    const input=document.querySelector('#weight'), slider=document.querySelector('#slider'), needle=document.querySelector('#needle'), reading=document.querySelector('#reading'), error=document.querySelector('#error'), exportButton=document.querySelector('#export'), exportStatus=document.querySelector('#exportStatus');
    const visibilityButton=document.querySelector('#toggleValue');
    visibilityButton.addEventListener('click',()=>{
      const hidden=document.body.classList.toggle('values-hidden');
      visibilityButton.setAttribute('aria-pressed',String(hidden));
      visibilityButton.textContent=hidden?'แสดงตัวเลข':'ซ่อนตัวเลข';
      input.tabIndex=hidden?-1:0;
      input.setAttribute('aria-hidden',String(hidden));
      reading.setAttribute('aria-hidden',String(hidden));
    });
    let weightUnit='kg';
    const unitButton=document.querySelector('#toggleUnit');
    function display(value,source){
      let number=Number(value);
      if(!Number.isFinite(number)){error.textContent='กรุณาใส่ตัวเลขตั้งแต่ 0 ถึง 5';return}
      const clamped=Math.max(0,Math.min(5,number));
      error.textContent=number!==clamped?'แสดงค่าสูงสุดภายในช่วง 0–5 กก.':'';
      const angle=(clamped/5)*360;
      needle.setAttribute('transform',`rotate(${angle} 300 300)`);
      needle.style.transform=`rotate(${angle}deg)`;
      needle.style.transformOrigin='300px 300px';needle.style.transition=source==='drag'?'none':'transform .45s cubic-bezier(.2,.8,.2,1)';
      reading.textContent=weightUnit==='g'?`${Math.round(clamped*1000)} g`:`${clamped.toFixed(1)} kg`;slider.value=clamped;slider.style.setProperty('--progress',`${clamped/5*100}%`);
      if(source==='slider'||source==='drag')input.value=weightUnit==='g'?String(Math.round(clamped*1000)):clamped.toFixed(1);
    }
    input.addEventListener('input',e=>display(Number(e.target.value)/(weightUnit==='g'?1000:1),'input'));
    input.addEventListener('blur',()=>{if(input.value==='')return;display(Number(input.value)/(weightUnit==='g'?1000:1),'slider')});
    unitButton.addEventListener('click',()=>{
      weightUnit=weightUnit==='kg'?'g':'kg';
      const grams=weightUnit==='g';
      unitButton.textContent=weightUnit+' ⇄';
      unitButton.setAttribute('aria-label',grams?'เปลี่ยนหน่วยเป็นกิโลกรัม':'เปลี่ยนหน่วยเป็นกรัม');
      input.max=grams?'5000':'5';input.step=grams?'100':'0.1';
      document.querySelector('#capacity').textContent=grams?'5000 g':'5 kg';
      [...labels.children].forEach((label,i)=>{label.textContent=grams?(i+1)*1000:i+1;label.setAttribute('font-size',grams?'34':'58');});
      const ends=document.querySelectorAll('.range-labels span');
      ends[0].textContent='0 '+weightUnit;ends[1].textContent=(grams?'5000':'5')+' '+weightUnit;
      display(slider.value,'slider');
    });
    slider.addEventListener('input',e=>display(e.target.value,'slider'));
    document.querySelector('#random').addEventListener('click',()=>{
      const tick=(Math.round(Number(slider.value)*10)+1+Math.floor(Math.random()*50))%51;
      display(tick/10,'slider');
    });
    const dial=document.querySelector('#dial');let drag=null;
    function scaleAngle(event){
      const p=dial.createSVGPoint();p.x=event.clientX;p.y=event.clientY;
      const local=p.matrixTransform(dial.getScreenCTM().inverse());
      return (Math.atan2(local.y-300,local.x-300)*180/Math.PI+450)%360;
    }
    needle.addEventListener('pointerdown',event=>{
      if(drag||event.button!==0)return;
      drag={id:event.pointerId,last:scaleAngle(event),value:Number(slider.value)};
      needle.style.transition='none';dial.classList.add('dragging');dial.setPointerCapture(event.pointerId);event.preventDefault();
    });
    dial.addEventListener('pointermove',event=>{
      if(!drag||drag.id!==event.pointerId)return;
      const angle=scaleAngle(event),delta=(angle-drag.last+540)%360-180;
      drag.value=Math.max(0,Math.min(5,drag.value+delta/72));drag.last=angle;
      display(Math.round(drag.value*10)/10,'drag');
    });
    const finishDrag=event=>{if(drag&&drag.id===event.pointerId){drag=null;dial.classList.remove('dragging')}};
    ['pointerup','pointercancel','lostpointercapture'].forEach(name=>dial.addEventListener(name,finishDrag));
    exportButton.addEventListener('click',async()=>{
      exportButton.disabled=true;
      try{
        const weight=Number(slider.value).toFixed(1).replace('.', '-');
        let fileHandle=null;
        if('showSaveFilePicker' in window){
          exportStatus.textContent='เลือกชื่อไฟล์และตำแหน่งจัดเก็บ…';
          fileHandle=await window.showSaveFilePicker({
            suggestedName:`fish-scale-${weight}kg.png`,
            types:[{description:'ไฟล์ภาพ PNG',accept:{'image/png':['.png']}}]
          });
        }
        exportStatus.textContent='กำลังสร้างไฟล์ PNG จากตำแหน่งเข็มล่าสุด…';
        const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
        canvas.width=1200;canvas.height=1620;
        const svg=document.querySelector('#scaleArtwork').cloneNode(true);
        svg.setAttribute('xmlns',NS);svg.setAttribute('width','600');svg.setAttribute('height','810');
        const svgUrl=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}));
        const dialImage=new Image();
        await new Promise((resolve,reject)=>{dialImage.onload=resolve;dialImage.onerror=reject;dialImage.src=svgUrl});
        const dialSize=1120;
        ctx.drawImage(dialImage,40,54,dialSize,1512);
        URL.revokeObjectURL(svgUrl);
        const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
        if(fileHandle){
          const writable=await fileHandle.createWritable();
          await writable.write(blob);await writable.close();
        }else{
          const link=document.createElement('a');
          link.href=URL.createObjectURL(blob);link.download=`fish-scale-${weight}kg.png`;link.click();
          setTimeout(()=>URL.revokeObjectURL(link.href),1000);
        }
        exportStatus.textContent='บันทึก PNG จากตำแหน่งเข็มล่าสุดเรียบร้อยแล้ว';
      }catch(e){
        exportStatus.textContent=e&&e.name==='AbortError'?'ยกเลิกการบันทึกไฟล์แล้ว':'ไม่สามารถส่งออกได้ กรุณาลองอีกครั้ง';
      }
      finally{exportButton.disabled=false}
    });
    display(2.5);
  </script>
